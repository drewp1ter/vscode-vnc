services:
  vscode:
    build: .
    ports:
      - "5901:5901"
    environment:
      VNC_PASSWORD: secret12
      HOME: /home/ubuntu
      CLAUDE_CONFIG_DIR: /home/ubuntu/.claude
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/lab/projects:/workspace:Z
      - ${HOME}/.claude:/home/ubuntu/.claude:Z
      - ${HOME}/.claude.json:/home/ubuntu/.claude.json:Z
      - ${HOME}/.continue:/home/ubuntu/.continue:Z
      - vscode-config:/home/ubuntu/.config/Code
      - opencode-config:/home/ubuntu/.config/opencode
      - ssh-keys-2:/home/ubuntu/.ssh
      - xfce-config:/home/ubuntu/.config/xfce4
      - vscode-extensions:/home/ubuntu/.vscode

volumes:
  vscode-config:
  opencode-config:
  ssh-keys-2:
  xfce-config:
  vscode-extensions:
